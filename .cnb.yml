main:
  api_trigger_publish_windows_release:
    - lock:
        key: dustmirror-public-windows-release
        expires: 72000
        wait: true
        timeout: 72000
      stages:
        - name: Refuse non-Product trigger or malformed identity
          script: |
            set -eu
            test "$CNB_REPO_SLUG" = "yitaocn/dust-mirror"
            test "$API_TRIGGER_REPO_SLUG" = "yitaocn/dustmirror"
            echo "$RELEASE_VERSION" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'
            echo "$PRODUCT_COMMIT" | grep -Eq '^[0-9a-f]{40}$'
            echo "$PRODUCT_TREE" | grep -Eq '^[0-9a-f]{40}$'
            echo "$PRODUCT_BUILD_ID" | grep -Eq '^[A-Za-z0-9._-]{1,128}$'
            if [ -n "${PUBLICATION_RESUME_GRANT_ID:-}" ]; then
              echo "$PUBLICATION_RESUME_GRANT_ID" | grep -Eq '^[A-Za-z0-9._-]{1,128}$'
            fi
        - name: Prepare the hash-locked verifier before importing any release secret
          timeout: 15m
          script: |
            set -eu
            rm -rf .release-ci-venv
            python3 -m venv .release-ci-venv
            ./.release-ci-venv/bin/python -m pip install --disable-pip-version-check --no-cache-dir --only-binary=:all: --require-hashes -r requirements-release-ci.txt
            ./.release-ci-venv/bin/python scripts/verify_release_runtime.py --require-venv
        - name: Download the build-bound private handoff from the exact Product commit
          image: cnbcool/attachments@sha256:37c2d53fed9accee6ea0a509a05a4d05e4b36af37d5319451c2284e287b9e935
          settings:
            type: DOWNLOAD
            slug: yitaocn/dustmirror
            commit: $PRODUCT_COMMIT
            attachments:
              - DustMirror-candidate-handoff-$PRODUCT_BUILD_ID.zip
        - name: Download a fresh signed resume-only grant when explicitly requested
          if: |
            [ -n "${PUBLICATION_RESUME_GRANT_ID:-}" ]
          image: cnbcool/attachments@sha256:37c2d53fed9accee6ea0a509a05a4d05e4b36af37d5319451c2284e287b9e935
          settings:
            type: DOWNLOAD
            slug: yitaocn/dustmirror
            commit: $PRODUCT_COMMIT
            attachments:
              - DustMirror-publication-resume-grant-$PUBLICATION_RESUME_GRANT_ID.json
              - DustMirror-publication-resume-grant-$PUBLICATION_RESUME_GRANT_ID.sig
        - name: Safely extract only the authorized public files from the closed handoff
          script: |
            set -eu
            rm -rf public-handoff
            mkdir public-handoff
            ./.release-ci-venv/bin/python scripts/extract_product_candidate_handoff.py --archive "DustMirror-candidate-handoff-$PRODUCT_BUILD_ID.zip" --output-directory public-handoff --tag "$RELEASE_VERSION" --product-build-id "$PRODUCT_BUILD_ID" --product-commit "$PRODUCT_COMMIT" --product-tree "$PRODUCT_TREE"
            mv public-handoff/* .
            rmdir public-handoff
            rm "DustMirror-candidate-handoff-$PRODUCT_BUILD_ID.zip"
            if [ -n "${PUBLICATION_RESUME_GRANT_ID:-}" ]; then
              mv "DustMirror-publication-resume-grant-$PUBLICATION_RESUME_GRANT_ID.json" publication-resume-grant.json
              mv "DustMirror-publication-resume-grant-$PUBLICATION_RESUME_GRANT_ID.sig" publication-resume-grant.sig
            else
              test ! -e publication-resume-grant.json
              test ! -e publication-resume-grant.sig
            fi
        - name: Verify authorization and reject replay or downgrade before creating a Release
          imports:
            - https://cnb.cool/yitaocn/dustmirror-release-secrets/-/blob/main/env.release.yml
          timeout: 10m
          script: |
            set -eu
            set --
            if [ -n "${PUBLICATION_RESUME_GRANT_ID:-}" ]; then
              test -s publication-resume-grant.json
              test -s publication-resume-grant.sig
              set -- --resume-grant publication-resume-grant.json --resume-grant-signature publication-resume-grant.sig
            fi
            ./.release-ci-venv/bin/python scripts/verify_publication_authorization.py --authorization publication-authorization.json --signature publication-authorization.sig --publication-public-key-b64 "$DUSTMIRROR_PUBLICATION_PUBLIC_KEY_B64" --expected-tag "$RELEASE_VERSION" --expected-product-build-id "$PRODUCT_BUILD_ID" --expected-product-commit "$PRODUCT_COMMIT" --expected-product-tree "$PRODUCT_TREE" --expected-cnb-repo "$CNB_REPO_SLUG" --expected-release-commit "$CNB_COMMIT" --expected-release-tree "$(git rev-parse 'HEAD^{tree}')" --manifest manifest.json --manifest-signature manifest.sig --trust-metadata trust.json --trust-signature trust.sig --free-bundle "DustMirror-${RELEASE_VERSION}-FREE-win64.zip" --gui-bundle "DustMirror-${RELEASE_VERSION}-GUI-win64.zip" --set-output "$@"
            ./.release-ci-venv/bin/python scripts/verify_cnb_release_state.py --mode preflight --tag "$RELEASE_VERSION" --repo "$CNB_REPO_SLUG" --product-build-id "$PRODUCT_BUILD_ID" --authorization publication-authorization.json --set-output
          exports:
            release_action: PUBLIC_RELEASE_ACTION
            missing_assets: PUBLIC_RELEASE_MISSING_ASSETS
            publication_resume_only: PUBLICATION_RESUME_ONLY
        - name: Enforce that a fresh resume grant can never create a Release
          script: |
            set -eu
            case "$PUBLICATION_RESUME_ONLY" in
              false) ;;
              true)
                test "$PUBLIC_RELEASE_ACTION" = "resume" -o "$PUBLIC_RELEASE_ACTION" = "resume_upload"
                ;;
              *) exit 2 ;;
            esac
        - name: Create a non-latest prerelease only after authorization succeeds
          if: |
            [ "$PUBLIC_RELEASE_ACTION" = "create" ]
          type: git:release
          options:
            tag: $RELEASE_VERSION
            title: DustMirror $RELEASE_VERSION
            description: "通过 Product 签名授权，等待公开仓完整资产复核。Product build: $PRODUCT_BUILD_ID"
            preRelease: true
            latest: false
        - name: Upload only the eight authorized files
          if: |
            [ "$PUBLIC_RELEASE_ACTION" = "create" ]
          image: cnbcool/attachments@sha256:37c2d53fed9accee6ea0a509a05a4d05e4b36af37d5319451c2284e287b9e935
          settings:
            tag: $RELEASE_VERSION
            attachments:
              - DustMirror-*-FREE-win64.zip
              - DustMirror-*-GUI-win64.zip
              - manifest.json
              - manifest.sig
              - trust.json
              - trust.sig
              - publication-authorization.json
              - publication-authorization.sig
        - name: Resume only the verified missing CNB attachments without overwrite
          imports:
            - https://cnb.cool/yitaocn/dustmirror-release-secrets/-/blob/main/env.release.yml
          if: |
            [ "$PUBLIC_RELEASE_ACTION" = "resume_upload" ]
          timeout: 1h
          script: |
            set -eu
            test -n "$PUBLIC_RELEASE_MISSING_ASSETS"
            ./.release-ci-venv/bin/python scripts/resume_cnb_release_upload.py --authorization publication-authorization.json --tag "$RELEASE_VERSION" --repo "$CNB_REPO_SLUG" --product-build-id "$PRODUCT_BUILD_ID" --expected-missing "$PUBLIC_RELEASE_MISSING_ASSETS"
        - name: Reject any missing, duplicate or extra prerelease attachment
          imports:
            - https://cnb.cool/yitaocn/dustmirror-release-secrets/-/blob/main/env.release.yml
          if: |
            [ "$PUBLIC_RELEASE_ACTION" = "create" ]
          script: |
            set -eu
            ./.release-ci-venv/bin/python scripts/verify_cnb_release_inventory.py --authorization publication-authorization.json --tag "$RELEASE_VERSION" --repo "$CNB_REPO_SLUG" --product-build-id "$PRODUCT_BUILD_ID"
        - name: Prepare both hosts and commit the recoverable two-host promotion
          imports:
            - https://cnb.cool/yitaocn/dustmirror-release-secrets/-/blob/main/env.release.yml
          timeout: 1h
          script: |
            set -eu
            test -n "$GITHUB_TOKEN"
            ./.release-ci-venv/bin/python scripts/promote_public_release.py --tag "$RELEASE_VERSION" --repo "$CNB_REPO_SLUG" --product-build-id "$PRODUCT_BUILD_ID" --authorization publication-authorization.json --output dual-promotion-receipt.json
            test -s dual-promotion-receipt.json
        - name: Read back both live latest states and the complete CNB inventory
          imports:
            - https://cnb.cool/yitaocn/dustmirror-release-secrets/-/blob/main/env.release.yml
          script: |
            set -eu
            ./.release-ci-venv/bin/python scripts/verify_cnb_release_state.py --mode postflight --tag "$RELEASE_VERSION" --repo "$CNB_REPO_SLUG"
            ./.release-ci-venv/bin/python scripts/verify_cnb_release_inventory.py --authorization publication-authorization.json --tag "$RELEASE_VERSION" --repo "$CNB_REPO_SLUG" --product-build-id "$PRODUCT_BUILD_ID"
            ./.release-ci-venv/bin/python scripts/sync_github_release.py --mode verify --tag "$RELEASE_VERSION" --product-build-id "$PRODUCT_BUILD_ID" --authorization publication-authorization.json --output github-mirror-receipt.json
